<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E07A5F" />
    <meta name="description" content="단둘이, 단 하나의 둘만의 이야기" />
    <meta name="application-name" content="단둘이" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ROUTE" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>단둘이</title>
  </head>
  <body>
    <div id="root">
      <div data-route-entry-shell="1" role="status" aria-live="polite" style="min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;background:#fffaf8;color:#3d405b;font-family:'SUIT Variable','SUIT',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center">
        <strong style="font-size:26px;letter-spacing:-1px;font-weight:900">단둘이</strong>
        <span data-route-entry-message style="font-size:12px;line-height:1.6;color:#777687">앱을 준비하고 있어요</span>
        <span aria-hidden="true" style="font-size:13px;letter-spacing:4px;color:#e07a5f">•••</span>
      </div>
    </div>
    <script>
      (() => {
        const root = document.getElementById('root');
        const showEntryFailure = () => {
          const shell = root?.querySelector('[data-route-entry-shell="1"]');
          const message = shell?.querySelector('[data-route-entry-message]');
          if (!message) return;
          message.textContent = '앱 시작 파일을 불러오는 중 문제가 생겼어요. 앱을 완전히 종료한 뒤 다시 실행해 주세요.';
        };

        // A module import can fail before src/main.tsx gets a chance to install
        // its own crash boundary. Keep a dependency-free fallback in index.html
        // so the native app never presents an unexplained blank/frozen screen.
        window.addEventListener('error', (event) => {
          if (event.error) showEntryFailure();
        });
        window.addEventListener('unhandledrejection', showEntryFailure);
        window.setTimeout(showEntryFailure, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

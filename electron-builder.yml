appId: com.route.couple
productName: 단둘이
copyright: Copyright © 단둘이

asar: true

files:
  - electron/**/*

extraResources:
  - from: build/icons/route.ico
    to: build/icons/route.ico
  - from: dist
    to: dist
    filter:
      - '**/*'

extraMetadata:
  main: electron/main.cjs

directories:
  output: release/windows

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/route.ico
  artifactName: DANDULI-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 단둘이
  runAfterFinish: true
  deleteAppDataOnUninstall: false

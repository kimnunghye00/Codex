name: ROUTE Stability Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: route-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build and critical user-flow smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify critical user-flow wiring
        run: npm run stability:flow

      - name: Verify native Android wiring
        run: npm run stability:native

      - name: Cross-validate repository and native invariants
        run: npm run stability:cross

      - name: Verify critical release guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f ROUTE_RELEASE_GUARDRAILS.md
          test -f src/AppCrashBoundary.tsx
          test -f src/lib/persistentBackup.ts
          test -f public/naver-map-host.html
          test -f firestore.rules
          test -f storage.rules
          test -f firebase.json
          test -f public/sw.js
          grep -q "AppCrashBoundary" src/main.tsx
          grep -q "preparePersistentBackup" src/main.tsx
          grep -q "recovery-runtime" src/main.tsx
          grep -q "initializeNativeApp" src/main.tsx
          grep -q "meluni-f4e00.web.app" src/components/location/LocationPage.tsx
          grep -q "ncpKeyId" public/naver-map-host.html
          grep -q '"storage"' firebase.json
          grep -q "backups" firestore.rules
          grep -q "backupMedia" storage.rules
          echo "ROUTE critical static checks passed."

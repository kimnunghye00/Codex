name: Deploy E2-2 Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'e2-2-preview/**'
      - '.github/workflows/e2-2-preview-deploy.yml'

concurrency:
  group: e2-2-preview-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUTE_FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.ROUTE_FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: meluni-f4e00
      FIREBASE_SITE_ID: e2-2-kimnunghye00

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare Firebase service account
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ADC_FILE="$RUNNER_TEMP/e2-2-firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$ADC_FILE"
          chmod 600 "$ADC_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$ADC_FILE" >> "$GITHUB_ENV"

      - name: Check credentials
        id: creds
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" && -z "$FIREBASE_TOKEN" ]]; then
            echo "Firebase deployment credentials are missing."
            exit 1
          fi

      - name: Ensure isolated Hosting site exists
        id: site
        if: ${{ steps.creds.outcome == 'success' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          CLI="npx --yes firebase-tools@15.29.0"
          echo "Ensuring Hosting site exists: $FIREBASE_SITE_ID"

          set +e
          OUTPUT=$($CLI hosting:sites:create "$FIREBASE_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"

          if [[ $CODE -eq 0 ]] || grep -qi "already exists" <<< "$OUTPUT"; then
            echo "Hosting site is ready: $FIREBASE_SITE_ID"
            exit 0
          fi

          if [[ -n "$FIREBASE_TOKEN" ]]; then
            echo "Retrying site creation with Firebase token."
            unset GOOGLE_APPLICATION_CREDENTIALS
            set +e
            OUTPUT=$($CLI hosting:sites:create "$FIREBASE_SITE_ID" --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive 2>&1)
            CODE=$?
            set -e
            echo "$OUTPUT"
            if [[ $CODE -eq 0 ]] || grep -qi "already exists" <<< "$OUTPUT"; then
              exit 0
            fi
          fi
          exit 1

      - name: Deploy E2-2 app
        id: deploy
        if: ${{ steps.creds.outcome == 'success' && steps.site.outcome == 'success' }}
        working-directory: e2-2-preview
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          CLI="npx --yes firebase-tools@15.29.0"
          if $CLI deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive; then
            exit 0
          fi

          if [[ -n "$FIREBASE_TOKEN" ]]; then
            echo "Retrying deployment with Firebase token."
            unset GOOGLE_APPLICATION_CREDENTIALS
            $CLI deploy --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          else
            exit 1
          fi

      - name: Verify live app
        id: verify
        if: ${{ steps.deploy.outcome == 'success' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="https://$FIREBASE_SITE_ID.web.app"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$URL/" | grep -q "E2-2 맛집 추천"
          echo "E2-2 preview is live: $URL"

      - name: Record deployment result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          STATUS="failure"
          if [[ "${{ steps.creds.outcome }}" == "success" && "${{ steps.site.outcome }}" == "success" && "${{ steps.deploy.outcome }}" == "success" && "${{ steps.verify.outcome }}" == "success" ]]; then
            STATUS="success"
          fi
          {
            echo "status=$STATUS"
            echo "url=https://$FIREBASE_SITE_ID.web.app"
            echo "credentials=${{ steps.creds.outcome }}"
            echo "site=${{ steps.site.outcome }}"
            echo "deploy=${{ steps.deploy.outcome }}"
            echo "verify=${{ steps.verify.outcome }}"
            echo "source_commit=$GITHUB_SHA"
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deploy-status/e2-2-preview.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-status/e2-2-preview.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record E2-2 preview deployment [skip ci]"
            git push
          fi

      - name: Fail when deployment did not complete
        if: ${{ always() && (steps.creds.outcome != 'success' || steps.site.outcome != 'success' || steps.deploy.outcome != 'success' || steps.verify.outcome != 'success') }}
        shell: bash
        run: |
          echo "E2-2 preview deployment did not complete successfully."
          exit 1

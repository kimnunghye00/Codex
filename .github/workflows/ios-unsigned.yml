name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build ROUTE web app
        run: npm run build

      - name: Create and sync iOS project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          npm run native:configure
          test -d ios/App/App.xcodeproj

      - name: Apply latest ROUTE iOS icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR='ios/App/App/Assets.xcassets/AppIcon.appiconset'
          test -f branding/platform-icons/route-ios-1024.png
          mkdir -p "$ICON_DIR"
          rm -f "$ICON_DIR"/*.png
          cp branding/platform-icons/route-ios-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath release/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          APP_PATH='release/ios-device/Build/Products/Release-iphoneos/App.app'
          test -d "$APP_PATH"
          rm -rf release/ios-package
          mkdir -p release/ios-package/Payload
          cp -R "$APP_PATH" release/ios-package/Payload/App.app
          cd release/ios-package
          /usr/bin/zip -qry "ROUTE-iOS-${VERSION}-unsigned.ipa" Payload

      - name: Upload ROUTE iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ROUTE-iOS-Build
          path: release/ios-package/ROUTE-iOS-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'scripts/configure-native.mjs'
      - '.github/workflows/android-debug-apk.yml'

concurrency:
  group: android-debug-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare fixed ROUTE test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/signing
          base64 --decode android/route-test-debug.keystore.b64 > android/signing/route-test-debug.keystore
          EXPECTED="40F608CE3D3DD13773271E6D61B2EB1C513904636AECD662D78B882C7A006A5A"
          ACTUAL="$(keytool -list -v -keystore android/signing/route-test-debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          echo "ROUTE test signing certificate SHA-256: ${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Configure native permissions
        run: npm run native:configure

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK signing identity and version
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          EXPECTED="40f608ce3d3dd13773271e6d61b2eb1c513904636aecd662d78b882c7a006a5a"
          ACTUAL="$(${APKSIGNER} verify --print-certs "${APK}" | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}' | tr '[:upper:]' '[:lower:]')"
          echo "APK signer SHA-256: ${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          ${AAPT} dump badging "${APK}" | head -n 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROUTE-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

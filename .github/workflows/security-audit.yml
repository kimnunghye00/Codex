name: ROUTE Dependency Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-audit.yml'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=moderate || true

      - name: Full dependency audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=moderate || true

      - name: Block high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

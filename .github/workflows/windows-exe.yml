name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Verify DANDULI web app build
        run: npm run build

      - name: Verify Electron main syntax
        run: node --check electron/main.cjs

      - name: Install Electron packaging tools
        shell: pwsh
        run: npm install --no-save --package-lock=false electron@latest electron-builder@latest

      - name: Build DANDULI Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --config electron-builder.yml --publish never

      - name: Verify bundled DANDULI UI
        shell: pwsh
        run: |
          $index = 'release/windows/win-unpacked/resources/dist/index.html'
          if (-not (Test-Path $index)) { throw 'Bundled DANDULI UI was not included in the Windows app.' }
          $assets = Get-ChildItem -Path 'release/windows/win-unpacked/resources/dist/assets' -File -ErrorAction SilentlyContinue
          if (-not $assets -or $assets.Count -lt 1) { throw 'Bundled DANDULI UI assets were not included in the Windows app.' }
          Write-Host "Bundled UI verified: $index / $($assets.Count) assets"

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release/windows -Filter '*.exe' -File
          if ($files.Count -lt 1) { throw 'DANDULI Windows installer was not generated.' }
          $files | ForEach-Object { Write-Host "Generated: $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload DANDULI Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DANDULI-Windows-Setup
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 30

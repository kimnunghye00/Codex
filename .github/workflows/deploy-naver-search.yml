name: Deploy 단둘이 Naver Search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/localSearch.js'
      - 'functions/index.js'
      - 'functions/package.json'
      - 'firebase.json'
      - '.github/workflows/deploy-naver-search.yml'

permissions:
  contents: read

jobs:
  search-function:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUTE_FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install CLI and validate search source
        run: |
          npm ci
          npm install --prefix functions --no-audit --no-fund
          node --check functions/localSearch.js
          node --check functions/index.js
          node --input-type=module -e "import fs from 'node:fs';const cfg=JSON.parse(fs.readFileSync('firebase.json','utf8'));if(cfg.functions?.source!=='functions')process.exit(1);"

      - name: Verify authorized Firebase deployment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo '::error::ROUTE_FIREBASE_SERVICE_ACCOUNT is missing. The deploy cannot run.'
            exit 1
          fi
          ADC_FILE="$RUNNER_TEMP/danduli-firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$ADC_FILE"
          chmod 600 "$ADC_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$ADC_FILE" >> "$GITHUB_ENV"
          # Public service-account email only, never print its private key.
          DEPLOY_PRINCIPAL="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).client_email' "$ADC_FILE")"
          echo "GitHub deploy identity: $DEPLOY_PRINCIPAL"
          {
            echo "### GitHub deployment service account"
            echo "Principal: \`$DEPLOY_PRINCIPAL\`"
            echo "If deployment fails with iam.serviceAccounts.ActAs, grant this principal Service Account User on the specific runtime service account named in the error."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose Cloud Functions list access (no credentials logged)
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const admin = require('./functions/node_modules/firebase-admin');
          const credential = admin.credential.cert(JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8')));
          (async () => {
            const { access_token } = await credential.getAccessToken();
            for (const version of ['v1', 'v2']) {
              const url = 'https://cloudfunctions.googleapis.com/' + version + '/projects/meluni-f4e00/locations/-/functions?pageSize=1';
              const response = await fetch(url, { headers: { Authorization: 'Bearer ' + access_token } });
              const payload = await response.json().catch(() => ({}));
              const error = payload.error || {};
              console.log('Cloud Functions LIST ' + version + ': HTTP ' + response.status
                + (error.status ? ', ' + error.status : ''));
              if (!response.ok && error.message) console.log('LIST ' + version + ' error: ' + String(error.message).slice(0, 350));
            }
          })().catch((e) => { console.error('LIST diagnostic failed: ' + e.message); process.exitCode = 1; });
          NODE

      - name: Deploy only the authenticated Naver search function
        shell: bash
        run: |
          set -euo pipefail
          # Both NAVER_LOCAL_SEARCH_ID and NAVER_LOCAL_SEARCH_SECRET must exist
          # in this project's Secret Manager before this deployment.
          npx --yes firebase-tools@15.29.0 deploy \
            --only functions:searchDatePlaces \
            --project meluni-f4e00 \
            --non-interactive

      - name: Next step
        shell: bash
        run: |
          {
            echo '### NAVER Search function deployment'
            echo 'The search function was deployed. The public HTTPS function URL is available in the deploy logs.'
            echo 'Set the repository Actions variable VITE_NAVER_LOCAL_SEARCH_URL to that URL (never the client ID/secret).'
            echo 'Then rerun **Deploy 단둘이 Web** to activate the search client.'
          } >> "$GITHUB_STEP_SUMMARY"

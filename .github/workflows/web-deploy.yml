name: Deploy 단둘이 Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/firebase-security*'
      - 'vitest.security.config.ts'
      - '.github/workflows/web-deploy.yml'

concurrency:
  group: route-web-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUTE_FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.ROUTE_FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase permissions and two-account flow
        run: npm run test:security

      - name: Build web app
        env:
          VITE_TURN_CREDENTIALS_URL: ${{ vars.VITE_TURN_CREDENTIALS_URL || 'https://codex.kimnunghye00.workers.dev' }}
          VITE_NAVER_LOCAL_SEARCH_URL: ${{ vars.VITE_NAVER_LOCAL_SEARCH_URL || '' }}
        run: npm run build

      - name: Verify PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/route-icon.svg
          grep -q 'manifest.webmanifest' dist/index.html

      - name: Verify critical release guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f ROUTE_RELEASE_GUARDRAILS.md
          test -f src/AppCrashBoundary.tsx
          test -f src/lib/persistentBackup.ts
          test -f public/naver-map-host.html
          test -f firestore.rules
          test -f storage.rules
          test -f firebase.json
          test -f public/sw.js
          grep -q "AppCrashBoundary" src/main.tsx
          grep -q "preparePersistentBackup" src/main.tsx
          grep -q "danduli.web.app" src/components/location/LocationPage.tsx
          grep -q '"danduli"' .firebaserc
          grep -q '"legacy"' .firebaserc
          grep -q "ncpKeyId" public/naver-map-host.html
          grep -q '"storage"' firebase.json
          grep -q "backups" firestore.rules
          grep -q "backupMedia" storage.rules
          echo "단둘이 web checks passed."

      - name: Prepare recommended Firebase ADC credentials
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ADC_FILE="$RUNNER_TEMP/route-firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$ADC_FILE"
          chmod 600 "$ADC_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$ADC_FILE" >> "$GITHUB_ENV"

      - name: Block stale web deployment
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' && env.FIREBASE_TOKEN == '' }}
        shell: bash
        run: |
          echo '::error::단둘이 web build passed, but Firebase deployment credentials are missing. Publishing is blocked so an old hosted screen cannot be mistaken for the latest main branch.'
          echo '### Firebase deployment blocked' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Configure **ROUTE_FIREBASE_SERVICE_ACCOUNT** (recommended) or **ROUTE_FIREBASE_TOKEN**, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Provision and verify danduli Hosting site
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' || env.FIREBASE_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            unset FIREBASE_TOKEN
          fi
          FIREBASE_CLI="npx --yes firebase-tools@15.29.0"
          # The Firebase project ID and Firebase Auth tenant stay unchanged.
          # This is a new Hosting site only, not a new Firebase project.
          if ! $FIREBASE_CLI hosting:sites:list --project meluni-f4e00 --json > "$RUNNER_TEMP/hosting-sites.json"; then
            echo '::error::Unable to read Hosting sites; legacy website remains untouched.'
            exit 1
          fi
          if ! node -e 'const v=require(process.argv[1]);const x=v.result?.sites||v.result||v.sites||[];process.exit(Array.isArray(x)&&x.some(s=>s.name?.split("/").pop()==="danduli"||s.siteId==="danduli")?0:1)' "$RUNNER_TEMP/hosting-sites.json"; then
            echo 'danduli site not found in this project; checking whether the global site ID can be created.'
            if ! $FIREBASE_CLI hosting:sites:create danduli --project meluni-f4e00 --non-interactive; then
              echo '::error::Unable to claim danduli.web.app; check global name availability and Hosting creation permissions. Existing site was not removed.'
              exit 1
            fi
          fi
          $FIREBASE_CLI hosting:sites:list --project meluni-f4e00 --json > "$RUNNER_TEMP/hosting-sites.json"
          node -e 'const v=require(process.argv[1]);const x=v.result?.sites||v.result||v.sites||[];if(!Array.isArray(x)||!x.some(s=>s.name?.split("/").pop()==="danduli"||s.siteId==="danduli"))process.exit(1)' "$RUNNER_TEMP/hosting-sites.json"
          echo 'danduli Hosting site belongs to the existing Firebase project.'

      - name: Deploy verified Firebase rules and Hosting
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' || env.FIREBASE_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Publish the new client only after its permission rules succeed.
          # Firebase releases are not atomic; a Hosting failure must be retried.
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            unset FIREBASE_TOKEN
          fi
          npx --yes firebase-tools@15.29.0 deploy \
            --only firestore:rules,storage \
            --project meluni-f4e00 \
            --non-interactive
          npx --yes firebase-tools@15.29.0 deploy \
            --only hosting:legacy,hosting:danduli \
            --project meluni-f4e00 \
            --non-interactive

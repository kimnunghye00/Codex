name: Deploy ROUTE Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/web-deploy.yml'

concurrency:
  group: route-web-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUTE_FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.ROUTE_FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Verify PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/route-icon.svg
          grep -q 'manifest.webmanifest' dist/index.html

      - name: Verify critical release guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f ROUTE_RELEASE_GUARDRAILS.md
          test -f src/AppCrashBoundary.tsx
          test -f src/lib/persistentBackup.ts
          test -f public/naver-map-host.html
          test -f firestore.rules
          test -f storage.rules
          test -f firebase.json
          test -f public/sw.js
          grep -q "AppCrashBoundary" src/main.tsx
          grep -q "preparePersistentBackup" src/main.tsx
          grep -q "meluni-f4e00.web.app" src/components/location/LocationPage.tsx
          grep -q "ncpKeyId" public/naver-map-host.html
          grep -q '"storage"' firebase.json
          grep -q "backups" firestore.rules
          grep -q "backupMedia" storage.rules
          echo "ROUTE web checks passed."

      - name: Prepare recommended Firebase ADC credentials
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ADC_FILE="$RUNNER_TEMP/route-firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$ADC_FILE"
          chmod 600 "$ADC_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$ADC_FILE" >> "$GITHUB_ENV"

      - name: Explain skipped deployment
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' && env.FIREBASE_TOKEN == '' }}
        shell: bash
        run: |
          echo '::warning::ROUTE build is healthy, but Firebase deployment credentials are not configured.'
          echo '### Firebase deployment skipped' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Add the **ROUTE_FIREBASE_SERVICE_ACCOUNT** repository secret (recommended), or the legacy **ROUTE_FIREBASE_TOKEN** secret, to enable automatic deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The build and release guardrails passed; only the external Firebase credential is missing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Hosting and Firebase rules
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' || env.FIREBASE_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Firebase recommends ADC for CI. If both credentials exist, prefer ADC
          # instead of the legacy FIREBASE_TOKEN environment variable.
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            unset FIREBASE_TOKEN
          fi
          npx --yes firebase-tools@15.29.0 deploy \
            --only hosting,firestore:rules,storage \
            --project meluni-f4e00 \
            --non-interactive

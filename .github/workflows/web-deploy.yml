name: Deploy ROUTE Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'firebase.json'
      - '.github/workflows/web-deploy.yml'

concurrency:
  group: route-web-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_TOKEN: ${{ secrets.ROUTE_FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/route-icon.svg
          grep -q 'manifest.webmanifest' dist/index.html

      - name: Verify critical release guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f ROUTE_RELEASE_GUARDRAILS.md
          test -f src/AppCrashBoundary.tsx
          test -f src/lib/persistentBackup.ts
          test -f public/naver-map-host.html
          test -f firestore.rules
          test -f storage.rules
          test -f firebase.json
          test -f public/sw.js
          grep -q "AppCrashBoundary" src/main.tsx
          grep -q "preparePersistentBackup" src/main.tsx
          grep -q "meluni-f4e00.web.app" src/components/location/LocationPage.tsx
          grep -q "ncpKeyId" public/naver-map-host.html
          grep -q '"storage"' firebase.json
          grep -q "backups" firestore.rules
          grep -q "backupMedia" storage.rules
          echo "ROUTE web checks passed."

      - name: Require Firebase deployment credentials
        if: ${{ env.FIREBASE_TOKEN == '' }}
        shell: bash
        run: |
          echo 'ERROR: GitHub Actions secret ROUTE_FIREBASE_TOKEN is missing.' >&2
          echo 'The web build succeeded, but nothing can be deployed to Firebase Hosting until this secret is configured.' >&2
          exit 1

      - name: Deploy to Firebase Hosting
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npx --yes firebase-tools deploy --only hosting --project meluni-f4e00 --token "$FIREBASE_TOKEN" --non-interactive

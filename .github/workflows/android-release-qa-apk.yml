name: Build Android OneStore Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-onestore-release-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare stable DANDULI upload signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/signing
          base64 --decode android/route-test-debug.keystore.b64 > android/signing/route-test-debug.keystore
          EXPECTED="40F608CE3D3DD13773271E6D61B2EB1C513904636AECD662D78B882C7A006A5A"
          ACTUAL="$(keytool -list -v -keystore android/signing/route-test-debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          echo "DANDULI upload signing certificate SHA-256: ${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

      - name: Restore Firebase Android config
        shell: bash
        env:
          ROUTE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ROUTE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ROUTE_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::warning::ROUTE_GOOGLE_SERVICES_JSON_BASE64 is not configured. Native Firebase features such as FCM push notifications will be unavailable in this release APK."
            exit 0
          fi

          printf '%s' "${ROUTE_GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'android/app/google-services.json';
          const json = JSON.parse(fs.readFileSync(path, 'utf8'));
          const projectId = json?.project_info?.project_id;
          const clients = Array.isArray(json?.client) ? json.client : [];
          const danduliClient = clients.find((client) => client?.client_info?.android_client_info?.package_name === 'com.e2.danduli');
          if (projectId !== 'meluni-f4e00') throw new Error(`Unexpected Firebase project_id: ${projectId ?? 'missing'}`);
          if (!danduliClient) {
            console.log('::warning::Firebase Android app com.e2.danduli is not present in the current google-services.json. Continuing this build without native Firebase services.');
            fs.unlinkSync(path);
            process.exit(0);
          }
          console.log('Firebase Android config verified for meluni-f4e00 / com.e2.danduli.');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run full DANDULI stability suite
        run: npm run stability

      - name: Configure native permissions
        run: npm run native:configure

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare transparent character launcher icons
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 scripts/prepare_character_launcher_icons.py

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Align and sign OneStore release APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="android/app/build/outputs/apk/release/DANDULI-onestore-release.apk"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          APKSIGNER="${BUILD_TOOLS}/apksigner"

          test -f "${UNSIGNED}"
          "${ZIPALIGN}" -f -p 4 "${UNSIGNED}" "${OUTPUT}.aligned"

          "${APKSIGNER}" sign             --ks android/signing/route-test-debug.keystore             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out "${OUTPUT}"             "${OUTPUT}.aligned"

          rm -f "${OUTPUT}.aligned"
          test -s "${OUTPUT}"

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/DANDULI-onestore-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          EXPECTED="40f608ce3d3dd13773271e6d61b2eb1c513904636aecd662d78b882c7a006a5a"

          VERIFY_OUTPUT="$("${APKSIGNER}" verify --verbose --print-certs "${APK}")"
          printf '%s\n' "${VERIFY_OUTPUT}"
          printf '%s\n' "${VERIFY_OUTPUT}" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'

          ACTUAL="$(printf '%s\n' "${VERIFY_OUTPUT}" | sed -n 's/^.*certificate SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          test -n "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

          BADGING="$("${AAPT}" dump badging "${APK}" | head -n 1)"
          echo "${BADGING}"
          printf '%s' "${BADGING}" | grep -q "name='com.e2.danduli'"
          VERSION_CODE="$(printf '%s\n' "${BADGING}" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
          test -n "${VERSION_CODE}"
          test "${VERSION_CODE}" -gt 1000000
          echo "DANDULI OneStore release APK versionCode: ${VERSION_CODE}"

      - name: Write build summary
        shell: bash
        run: |
          echo '### 단둘이 Android OneStore Release APK' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: main @ \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Build type: release (non-debug)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Package: com.e2.danduli' >> "$GITHUB_STEP_SUMMARY"
          echo '- APK Signature Scheme v2: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Artifact: DANDULI-onestore-release-apk' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OneStore release APK
        uses: actions/upload-artifact@v4
        with:
          name: DANDULI-onestore-release-apk
          path: android/app/build/outputs/apk/release/DANDULI-onestore-release.apk
          if-no-files-found: error
          retention-days: 14

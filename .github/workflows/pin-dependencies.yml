name: Pin 단둘이 dependency versions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pin-dependencies.mjs'
      - '.github/workflows/pin-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: route-dependency-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Pin direct dependencies to validated lockfile versions
        run: node scripts/pin-dependencies.mjs

      - name: Verify deterministic install
        run: npm ci

      - name: Run 단둘이 stability suite
        run: npm run stability

      - name: Commit pinned manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependencies are already pinned.'
            exit 0
          fi
          git commit -m 'chore: pin validated dependency versions'
          git push

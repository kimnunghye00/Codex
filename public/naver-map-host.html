<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ROUTE Map Host</title>
  <style>
    html,body,#map{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eef0f5}
    #diagnostic{position:absolute;left:10px;bottom:10px;z-index:9999;display:none;padding:7px 9px;border-radius:10px;background:#fffde;color:#6a4a3b;font:11px/1.35 system-ui,-apple-system,sans-serif;box-shadow:0 2px 10px #0002}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="diagnostic"></div>
  <script>
    (() => {
      /*
       * This project originally used NAVER Cloud's legacy Maps application.
       * NAVER later changed JavaScript authentication from ncpClientId to
       * ncpKeyId. ROUTE accepts either so the fixed host keeps working during
       * the migration and across old/new NAVER Cloud applications.
       */
      const CLIENT_ID = 'z3njcg8upv';
      const AUTH_PARAMS = ['ncpKeyId', 'ncpClientId'];
      let authIndex = 0;
      let activeAttempt = 0;
      let activeScript = null;
      let map;
      let overlays = [];
      let focusOverlay = null;
      let focusPopup = null;
      let lastRender = { visits: [], mode: 'map' };

      const send = (type, detail = {}) => {
        if (window.parent === window) return;
        window.parent.postMessage({ source: 'route-map-host', type, ...detail }, '*');
      };

      const markerHtml = (current, index) => {
        const color = current ? '#E07A5F' : '#3D405B';
        const size = current ? 24 : 20;
        const label = Number.isInteger(index) ? `<span style="font-size:9px;color:#fff;font-weight:800">${index + 1}</span>` : '';
        return `<div style="width:${size}px;height:${size}px;border:3px solid #fff;border-radius:50%;background:${color};box-shadow:0 3px 10px #0003;display:grid;place-items:center">${label}</div>`;
      };

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'\"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character] || character));

      const timeText = (value) => {
        if (!value) return '현재';
        try { return new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit' }).format(new Date(value)); }
        catch { return ''; }
      };

      const dayText = (value) => {
        try { return new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }).format(new Date(value)); }
        catch { return ''; }
      };

      const clearOverlays = () => {
        overlays.forEach((overlay) => { try { overlay.setMap(null); } catch {} });
        overlays = [];
      };

      const clearFocus = () => {
        try { focusPopup?.close(); } catch {}
        try { focusOverlay?.setMap(null); } catch {}
        focusPopup = null;
        focusOverlay = null;
      };

      const render = ({ visits = [], mode = 'map' } = {}) => {
        lastRender = { visits: Array.isArray(visits) ? visits : [], mode };
        if (!map || !window.naver?.maps) return;
        const naver = window.naver;
        naver.maps.Event.trigger(map, 'resize');
        clearOverlays();

        if (!lastRender.visits.length) {
          if (!focusOverlay) {
            map.setCenter(new naver.maps.LatLng(37.5666103, 126.9783882));
            map.setZoom(15);
          }
          return;
        }

        const validVisits = lastRender.visits.filter((visit) => Number.isFinite(Number(visit.latitude)) && Number.isFinite(Number(visit.longitude)));
        const points = validVisits.map((visit) => new naver.maps.LatLng(Number(visit.latitude), Number(visit.longitude)));
        if (!points.length) return;
        if (points.length > 1) overlays.push(new naver.maps.Polyline({ map, path: points, strokeColor: '#E07A5F', strokeWeight: 5, strokeOpacity: 0.76 }));

        validVisits.forEach((visit, index) => {
          const current = !visit.leftAt && index === validVisits.length - 1;
          const marker = new naver.maps.Marker({
            map,
            position: points[index],
            icon: { content: markerHtml(current, mode === 'footprints' ? index : undefined) },
          });
          const popup = new naver.maps.InfoWindow({
            content: `<div style="padding:10px 12px;font-size:12px;line-height:1.45"><strong>${escapeHtml(visit.placeName || '위치 기록')}</strong><br>${escapeHtml(dayText(visit.arrivedAt))} · ${escapeHtml(timeText(visit.arrivedAt))}${visit.leftAt ? ` ~ ${escapeHtml(timeText(visit.leftAt))}` : ' · 현재'}</div>`,
            borderWidth: 0,
            backgroundColor: '#fff',
          });
          naver.maps.Event.addListener(marker, 'click', () => popup.open(map, marker));
          overlays.push(marker);
        });

        if (focusOverlay) return;
        if (points.length === 1) {
          map.setCenter(points[0]);
          map.setZoom(17);
        } else {
          const bounds = new naver.maps.LatLngBounds();
          points.forEach((point) => bounds.extend(point));
          map.fitBounds(bounds, { top: 34, right: 34, bottom: 34, left: 34 });
        }
      };

      const focus = (visit, showPopup = true) => {
        if (!map || !window.naver?.maps || !visit) return;
        const latitude = Number(visit.latitude);
        const longitude = Number(visit.longitude);
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
        const naver = window.naver;
        const point = new naver.maps.LatLng(latitude, longitude);
        clearFocus();
        focusOverlay = new naver.maps.Marker({
          map,
          position: point,
          icon: { content: markerHtml(true) },
          zIndex: 2000,
        });
        focusPopup = new naver.maps.InfoWindow({
          content: `<div style="padding:10px 12px;font-size:12px;line-height:1.45"><strong>${escapeHtml(visit.placeName || '일정 장소')}</strong><br><span style="color:#777">ROUTE에서 연결한 장소</span></div>`,
          borderWidth: 0,
          backgroundColor: '#fff',
        });
        naver.maps.Event.addListener(focusOverlay, 'click', () => focusPopup?.open(map, focusOverlay));
        map.setCenter(point);
        map.setZoom(17);
        if (showPopup !== false) focusPopup.open(map, focusOverlay);
      };

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const data = event.data || {};
        if (data.source !== 'route-map-parent') return;
        if (data.type === 'render') render(data);
        if (data.type === 'focus') focus(data.visit, data.showPopup);
        if (data.type === 'clear-focus') { clearFocus(); render(lastRender); }
        if (data.type === 'resize' && map && window.naver?.maps) window.naver.maps.Event.trigger(map, 'resize');
      });

      const cleanupSdk = () => {
        clearFocus();
        try { activeScript?.remove(); } catch {}
        activeScript = null;
        try { delete window.naver; } catch { window.naver = undefined; }
      };

      const initializeMap = (attempt) => {
        if (attempt !== activeAttempt) return;
        try {
          if (!window.naver?.maps) throw new Error('NAVER_MAP_INIT_FAILED');
          map = new window.naver.maps.Map(document.getElementById('map'), {
            center: new window.naver.maps.LatLng(37.5666103, 126.9783882),
            zoom: 15,
            zoomControl: true,
            zoomControlOptions: { position: window.naver.maps.Position.TOP_RIGHT },
          });
          requestAnimationFrame(() => requestAnimationFrame(() => window.naver.maps.Event.trigger(map, 'resize')));
          send('ready', { authMode: AUTH_PARAMS[authIndex] });
          render(lastRender);
        } catch (error) {
          console.error('[ROUTE map host init]', error);
          send('init-error', { authMode: AUTH_PARAMS[authIndex] });
        }
      };

      const loadSdk = () => {
        const attempt = ++activeAttempt;
        const authParam = AUTH_PARAMS[authIndex];
        let rejected = false;

        cleanupSdk();

        window.navermap_authFailure = () => {
          if (attempt !== activeAttempt || rejected) return;
          rejected = true;
          console.warn('[ROUTE NAVER map auth failed]', { authParam, origin: location.origin });

          if (authIndex + 1 < AUTH_PARAMS.length) {
            authIndex += 1;
            window.setTimeout(loadSdk, 80);
            return;
          }

          send('auth-error', { tried: AUTH_PARAMS.slice(), origin: location.origin });
        };

        const script = document.createElement('script');
        activeScript = script;
        script.async = true;
        script.defer = true;
        script.dataset.routeNaverAuth = authParam;
        script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?${authParam}=${encodeURIComponent(CLIENT_ID)}`;
        script.onload = () => {
          if (attempt !== activeAttempt || rejected) return;
          window.setTimeout(() => {
            if (attempt !== activeAttempt || rejected) return;
            initializeMap(attempt);
          }, 60);
        };
        script.onerror = () => {
          if (attempt !== activeAttempt || rejected) return;
          rejected = true;
          if (authIndex + 1 < AUTH_PARAMS.length) {
            authIndex += 1;
            window.setTimeout(loadSdk, 80);
            return;
          }
          send('script-error', { tried: AUTH_PARAMS.slice() });
        };
        document.head.appendChild(script);
      };

      loadSdk();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ROUTE Map Host</title>
  <style>
    html,body,#map{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eef0f5}
    #map-status{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#eef0f5;color:#3d405b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    #map-status[hidden]{display:none}
    #map-status .card{max-width:420px;padding:18px 20px;border:1px solid #d9dce5;border-radius:18px;background:#fff;box-shadow:0 10px 30px rgba(61,64,91,.08)}
    #map-status strong{display:block;margin-bottom:7px;font-size:15px}
    #map-status span{display:block;font-size:12px;line-height:1.55;color:#737684;word-break:keep-all}
    #map-status code{display:block;margin-top:9px;font-size:10px;color:#a04939;word-break:break-all}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="map-status" role="status" aria-live="polite">
    <div class="card"><strong>네이버 지도를 불러오는 중이에요</strong><span>지도 SDK와 인증 상태를 확인하고 있어요.</span><code id="map-status-code">SDK_LOADING</code></div>
  </div>
  <script>
    (() => {
      const CLIENT_ID = 'z3njcg8upv';
      const SDK_URL = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(CLIENT_ID)}&callback=__routeNaverMapReady`;
      const statusRoot = document.getElementById('map-status');
      const statusTitle = statusRoot.querySelector('strong');
      const statusText = statusRoot.querySelector('span');
      const statusCode = document.getElementById('map-status-code');
      let map;
      let overlays = [];
      let focusOverlay = null;
      let focusPopup = null;
      let initialized = false;
      let authFailed = false;
      let loadFailed = false;
      let initTimer;
      let sdkWaitTimer;
      let sdkWaitStartedAt = 0;
      let lastRender = { visits: [], mode: 'map' };

      const send = (type, detail = {}) => {
        if (window.parent === window) return;
        window.parent.postMessage({ source: 'route-map-host', type, ...detail }, '*');
      };

      const showStatus = (title, text, code) => {
        statusTitle.textContent = title;
        statusText.textContent = text;
        statusCode.textContent = code;
        statusRoot.hidden = false;
      };

      const hideStatus = () => { statusRoot.hidden = true; };

      const clearSdkWait = () => {
        if (sdkWaitTimer) window.clearTimeout(sdkWaitTimer);
        sdkWaitTimer = undefined;
        sdkWaitStartedAt = 0;
      };

      const fail = (type, title, text, code) => {
        if (initialized || loadFailed) return;
        loadFailed = true;
        window.clearTimeout(initTimer);
        clearSdkWait();
        showStatus(title, text, code);
        send(type, { origin: location.origin, code });
      };

      const hasMapSdk = () => Boolean(window.naver?.maps?.Map && window.naver?.maps?.LatLng);

      const activePalette = () => {
        let view = window;
        let root = document.documentElement;
        try {
          if (window.parent !== window && window.parent.location.origin === location.origin) {
            view = window.parent;
            root = window.parent.document.documentElement;
          }
        } catch { /* standalone map host keeps the default palette */ }
        const styles = view.getComputedStyle(root);
        const primary = styles.getPropertyValue('--primary').trim() || '#3D405B';
        const accent = styles.getPropertyValue('--route-accent').trim() || styles.getPropertyValue('--primary-light').trim() || '#E07A5F';
        return { primary, accent };
      };

      const markerSize = (current) => current ? 24 : 20;
      const markerHtml = (current, index, palette) => {
        const color = current ? palette.accent : palette.primary;
        const size = markerSize(current);
        const label = Number.isInteger(index) ? `<span style="font-size:9px;color:#fff;font-weight:800">${index + 1}</span>` : '';
        return `<div style="width:${size}px;height:${size}px;border:3px solid #fff;border-radius:50%;background:${color};box-sizing:border-box;box-shadow:0 3px 10px #0003;display:grid;place-items:center">${label}</div>`;
      };

      const markerIcon = (naver, current, index, palette = activePalette()) => {
        const size = markerSize(current);
        return { content: markerHtml(current, index, palette), anchor: new naver.maps.Point(size / 2, size / 2) };
      };

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'\"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character] || character));

      const timeText = (value) => {
        if (!value) return '현재';
        try { return new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit' }).format(new Date(value)); }
        catch { return ''; }
      };

      const dayText = (value) => {
        try { return new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }).format(new Date(value)); }
        catch { return ''; }
      };

      const clearOverlays = () => {
        overlays.forEach((overlay) => { try { overlay.setMap(null); } catch {} });
        overlays = [];
      };

      const clearFocus = () => {
        try { focusPopup?.close(); } catch {}
        try { focusOverlay?.setMap(null); } catch {}
        focusPopup = null;
        focusOverlay = null;
      };

      const render = ({ visits = [], mode = 'map' } = {}) => {
        lastRender = { visits: Array.isArray(visits) ? visits : [], mode };
        if (!map || !hasMapSdk()) return;
        const naver = window.naver;
        const palette = activePalette();
        naver.maps.Event.trigger(map, 'resize');
        clearOverlays();

        const validVisits = lastRender.visits
          .filter((visit) => Number.isFinite(Number(visit.latitude)) && Number.isFinite(Number(visit.longitude)))
          .sort((a, b) => new Date(a.arrivedAt || 0).getTime() - new Date(b.arrivedAt || 0).getTime());

        if (!validVisits.length) {
          if (!focusOverlay) {
            map.setCenter(new naver.maps.LatLng(37.5666103, 126.9783882));
            map.setZoom(15);
          }
          return;
        }

        // Markers and the route reuse the exact same LatLng objects. The path
        // therefore ends at each marker's geographic center rather than a
        // separately calculated pixel offset.
        const points = validVisits.map((visit) => new naver.maps.LatLng(Number(visit.latitude), Number(visit.longitude)));

        // The recent-places screen can contain visits from more than one day.
        // Connect every displayed visit chronologically so the route never
        // disappears simply because two visible points belong to different days.
        if (points.length >= 2) {
          overlays.push(new naver.maps.Polyline({
            map,
            path: points,
            strokeColor: palette.accent,
            strokeWeight: 2,
            strokeOpacity: 0.9,
            strokeLineCap: 'round',
            strokeLineJoin: 'round',
            zIndex: 100,
          }));
        }

        validVisits.forEach((visit, index) => {
          const current = !visit.leftAt && index === validVisits.length - 1;
          const marker = new naver.maps.Marker({
            map,
            position: points[index],
            icon: markerIcon(naver, current, mode === 'footprints' ? index : undefined, palette),
            zIndex: 200,
          });
          const popup = new naver.maps.InfoWindow({
            content: `<div style="padding:10px 12px;font-size:12px;line-height:1.45"><strong>${escapeHtml(visit.placeName || '위치 기록')}</strong><br>${escapeHtml(dayText(visit.arrivedAt))} · ${escapeHtml(timeText(visit.arrivedAt))}${visit.leftAt ? ` ~ ${escapeHtml(timeText(visit.leftAt))}` : ' · 현재'}</div>`,
            borderWidth: 0,
            backgroundColor: '#fff',
          });
          naver.maps.Event.addListener(marker, 'click', () => popup.open(map, marker));
          overlays.push(marker);
        });

        if (focusOverlay) return;
        if (points.length === 1) {
          map.setCenter(points[0]);
          map.setZoom(17);
        } else {
          const bounds = new naver.maps.LatLngBounds();
          points.forEach((point) => bounds.extend(point));
          map.fitBounds(bounds, { top: 34, right: 34, bottom: 34, left: 34 });
        }
      };

      const focus = (visit, showPopup = true) => {
        if (!map || !hasMapSdk() || !visit) return;
        const latitude = Number(visit.latitude);
        const longitude = Number(visit.longitude);
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
        const naver = window.naver;
        const point = new naver.maps.LatLng(latitude, longitude);
        clearFocus();
        focusOverlay = new naver.maps.Marker({
          map,
          position: point,
          icon: markerIcon(naver, true, undefined, activePalette()),
          zIndex: 2000,
        });
        focusPopup = new naver.maps.InfoWindow({
          content: `<div style="padding:10px 12px;font-size:12px;line-height:1.45"><strong>${escapeHtml(visit.placeName || '일정 장소')}</strong><br><span style="color:#777">ROUTE에서 연결한 장소</span></div>`,
          borderWidth: 0,
          backgroundColor: '#fff',
        });
        naver.maps.Event.addListener(focusOverlay, 'click', () => focusPopup?.open(map, focusOverlay));
        map.setCenter(point);
        map.setZoom(17);
        if (showPopup !== false) focusPopup.open(map, focusOverlay);
      };

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const data = event.data || {};
        if (data.source !== 'route-map-parent') return;
        if (data.type === 'render') render(data);
        if (data.type === 'focus') focus(data.visit, data.showPopup);
        if (data.type === 'clear-focus') { clearFocus(); render(lastRender); }
        if (data.type === 'resize' && map && hasMapSdk()) window.naver.maps.Event.trigger(map, 'resize');
      });

      try {
        if (window.parent !== window && window.parent.location.origin === location.origin) {
          const themeObserver = new MutationObserver(() => {
            if (initialized) render(lastRender);
          });
          themeObserver.observe(window.parent.document.documentElement, {
            attributes: true,
            attributeFilter: ['data-route-theme', 'data-meluni-theme', 'class', 'style'],
          });
        }
      } catch { /* theme sync is optional in standalone mode */ }

      window.navermap_authFailure = () => {
        authFailed = true;
        fail(
          'auth-error',
          '네이버 지도 인증이 거부됐어요',
          'NAVER Cloud Maps의 Dynamic Map과 Web 서비스 URL을 다시 확인해 주세요.',
          `NAVER_AUTH_FAILED · ${location.origin}`,
        );
      };

      const initializeMap = () => {
        if (authFailed || initialized || loadFailed || !hasMapSdk()) return;
        try {
          map = new window.naver.maps.Map(document.getElementById('map'), {
            center: new window.naver.maps.LatLng(37.5666103, 126.9783882),
            zoom: 15,
            zoomControl: true,
            zoomControlOptions: { position: window.naver.maps.Position.TOP_RIGHT },
          });
          initialized = true;
          window.clearTimeout(initTimer);
          clearSdkWait();
          hideStatus();
          requestAnimationFrame(() => requestAnimationFrame(() => window.naver.maps.Event.trigger(map, 'resize')));
          send('ready', { origin: location.origin, authMode: 'ncpKeyId' });
          render(lastRender);
        } catch (error) {
          console.error('[ROUTE map host init]', error);
          fail(
            'init-error',
            '네이버 지도 초기화에 실패했어요',
            '지도 SDK는 준비됐지만 Map 객체 생성 중 오류가 발생했어요.',
            error instanceof Error ? error.message : 'NAVER_MAP_INIT_FAILED',
          );
        }
      };

      const waitForMapSdk = (source) => {
        if (authFailed || initialized || loadFailed) return;
        if (!sdkWaitStartedAt) sdkWaitStartedAt = Date.now();
        if (hasMapSdk()) {
          initializeMap();
          return;
        }
        const elapsed = Date.now() - sdkWaitStartedAt;
        showStatus(
          '네이버 지도 SDK를 준비하고 있어요',
          '응답은 받았고 지도 객체가 준비될 때까지 잠시 기다리고 있어요.',
          `SDK_WAITING · ${source} · ${Math.round(elapsed / 100) / 10}s`,
        );
        if (elapsed >= 7000) {
          fail(
            'script-error',
            '네이버 지도 SDK 준비가 완료되지 않았어요',
            '응답은 받았지만 naver.maps 객체가 생성되지 않았어요. 인증 또는 SDK 응답 내용을 추가로 확인해야 해요.',
            `NAVER_MAP_SDK_MISSING · ${source}`,
          );
          return;
        }
        sdkWaitTimer = window.setTimeout(() => waitForMapSdk(source), 100);
      };

      window.__routeNaverMapReady = () => waitForMapSdk('callback');

      send('host-ready', { origin: location.origin });
      send('sdk-loading', { origin: location.origin, authMode: 'ncpKeyId' });
      showStatus('네이버 지도를 불러오는 중이에요', '지도 SDK와 인증 상태를 확인하고 있어요.', `SDK_LOADING · ${location.origin}`);

      const script = document.createElement('script');
      script.async = true;
      script.defer = true;
      script.src = SDK_URL;
      script.onload = () => {
        window.setTimeout(() => waitForMapSdk('script-onload'), 50);
      };
      script.onerror = () => {
        fail(
          'script-error',
          '네이버 지도 SDK에 연결하지 못했어요',
          '브라우저의 네트워크, 광고 차단·보안 DNS 또는 NAVER 지도 SDK 연결 상태를 확인해 주세요.',
          'NAVER_SDK_LOAD_FAILED',
        );
      };
      document.head.appendChild(script);

      initTimer = window.setTimeout(() => {
        if (initialized || authFailed || loadFailed) return;
        if (hasMapSdk()) {
          initializeMap();
          return;
        }
        waitForMapSdk('timeout-fallback');
      }, 2500);
    })();
  </script>
</body>
</html>

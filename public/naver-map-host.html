<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ROUTE Map Host</title>
  <style>
    html,body,#map{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eef0f5}
    #map-status{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#eef0f5;color:#3d405b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    #map-status[hidden]{display:none}
    #map-status .card{max-width:420px;padding:18px 20px;border:1px solid #d9dce5;border-radius:18px;background:#fff;box-shadow:0 10px 30px rgba(61,64,91,.08)}
    #map-status strong{display:block;margin-bottom:7px;font-size:15px}
    #map-status span{display:block;font-size:12px;line-height:1.55;color:#737684;word-break:keep-all}
    #map-status code{display:block;margin-top:9px;font-size:10px;color:#a04939;word-break:break-all}
    /* One marker per place; its tip matches the (18, 42) geographic anchor. */
    .danduli-map-pin{position:relative;width:36px;height:43px;filter:drop-shadow(0 3px 3px #0003)}
    .danduli-map-pin svg{display:block;width:36px;height:43px;overflow:visible}
    .danduli-map-pin .pin-body{fill:var(--pin-primary)}
    .danduli-map-pin.planned .pin-body{fill:var(--pin-accent)}
    .danduli-map-pin.selected{transform:scale(1.17);transform-origin:center bottom;filter:drop-shadow(0 3px 6px #0004)}
    .danduli-map-pin .pin-order{position:absolute;top:-7px;right:-7px;z-index:1;background:#fff;border:1px solid var(--pin-primary);color:var(--pin-primary);border-radius:999px;min-width:16px;height:16px;padding:0 2px;box-sizing:border-box;display:grid;place-items:center;font:800 10px system-ui}
    .danduli-map-cluster{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:3px solid #fff;background:var(--pin-primary);color:#fff;box-shadow:0 3px 9px #0003;font:800 13px system-ui;box-sizing:border-box}
    .danduli-place-card{min-width:160px;max-width:210px;padding:9px 10px;font:12px/1.5 system-ui,-apple-system,sans-serif;color:#383848;overflow-wrap:anywhere}
    .danduli-place-card strong{display:block;font-size:13px;margin-bottom:3px}
    .danduli-place-card small{display:block;color:#777;line-height:1.5}
    .danduli-place-card img{display:block;width:100%;height:96px;object-fit:cover;border-radius:9px;margin:0 0 7px;background:#f6eff0}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="map-status" role="status" aria-live="polite">
    <div class="card"><strong>네이버 지도를 불러오는 중이에요</strong><span>지도 SDK와 인증 상태를 확인하고 있어요.</span><code id="map-status-code">SDK_LOADING</code></div>
  </div>
  <script>
    (() => {
      const CLIENT_ID = 'z3njcg8upv';
      const SDK_URL = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(CLIENT_ID)}&callback=__routeNaverMapReady`;
      const statusRoot = document.getElementById('map-status');
      const statusTitle = statusRoot.querySelector('strong');
      const statusText = statusRoot.querySelector('span');
      const statusCode = document.getElementById('map-status-code');
      let map;
      let overlays = [];
      let focusOverlay = null;
      let focusPopup = null;
      let initialized = false;
      let authFailed = false;
      let loadFailed = false;
      let initTimer;
      let sdkWaitTimer;
      let sdkWaitStartedAt = 0;
      let lastRender = { visits: [], mode: 'map' };
      let pickMode = false;
      let parentRenderReceived = false;
      let lastMarkersZoom = null;
      let restoredForMode = false;
      const VIEWPORT_PREFIX = 'danduli:naver-map:viewport:v1:';

      // A map iframe may be remounted during UI navigation or a reload. Preserve
      // only the current tab's viewport; never share map positions across modes.
      const rememberViewport = () => {
        if (!map || !parentRenderReceived) return;
        const center = map.getCenter();
        const latitude = Number(center?.lat());
        const longitude = Number(center?.lng());
        const zoom = Number(map.getZoom());
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)
          || !Number.isFinite(zoom)) return;
        try {
          sessionStorage.setItem(VIEWPORT_PREFIX + lastRender.mode,
            JSON.stringify({ latitude, longitude, zoom }));
        } catch { /* Storage can be unavailable in private/embedded mode. */ }
      };

      const restoreViewport = (mode) => {
        if (!map) return false;
        try {
          const raw = sessionStorage.getItem(VIEWPORT_PREFIX + mode);
          if (!raw) return false;
          const saved = JSON.parse(raw);
          if (!Number.isFinite(saved.latitude) || Math.abs(saved.latitude) > 90
            || !Number.isFinite(saved.longitude) || Math.abs(saved.longitude) > 180
            || !Number.isInteger(saved.zoom) || saved.zoom < 3 || saved.zoom > 21) return false;
          map.setCenter(new window.naver.maps.LatLng(saved.latitude, saved.longitude));
          map.setZoom(saved.zoom);
          return true;
        } catch { return false; }
      };

      const send = (type, detail = {}) => {
        if (window.parent === window) return;
        window.parent.postMessage({ source: 'route-map-host', type, ...detail }, '*');
      };

      const showStatus = (title, text, code) => {
        statusTitle.textContent = title;
        statusText.textContent = text;
        statusCode.textContent = code;
        statusRoot.hidden = false;
      };

      const hideStatus = () => { statusRoot.hidden = true; };

      const clearSdkWait = () => {
        if (sdkWaitTimer) window.clearTimeout(sdkWaitTimer);
        sdkWaitTimer = undefined;
        sdkWaitStartedAt = 0;
      };

      const fail = (type, title, text, code) => {
        if (initialized || loadFailed) return;
        loadFailed = true;
        window.clearTimeout(initTimer);
        clearSdkWait();
        showStatus(title, text, code);
        send(type, { origin: location.origin, code });
      };

      const hasMapSdk = () => Boolean(window.naver?.maps?.Map && window.naver?.maps?.LatLng);

      const activePalette = () => {
        let view = window;
        let root = document.documentElement;
        try {
          if (window.parent !== window && window.parent.location.origin === location.origin) {
            view = window.parent;
            root = window.parent.document.documentElement;
          }
        } catch { /* standalone map host keeps the default palette */ }
        const styles = view.getComputedStyle(root);
        const primary = styles.getPropertyValue('--primary').trim() || '#3D405B';
        const accent = styles.getPropertyValue('--route-accent').trim() || styles.getPropertyValue('--primary-light').trim() || '#E07A5F';
        return { primary, accent };
      };

      // Single vector pin; no image downloaded per location.
      const markerHtml = (current, index, palette, planned = false) => {
        const label = Number.isInteger(index) && index >= 0 ? `<span class="pin-order">${index + 1}</span>` : '';
        return `<div class="danduli-map-pin${current ? ' selected' : ''}${planned ? ' planned' : ''}" style="--pin-primary:${palette.primary};--pin-accent:${palette.accent}"><svg viewBox="0 0 36 43" aria-hidden="true"><path class="pin-body" d="M18 42C15 36 3 25 3 16a15 15 0 0 1 30 0c0 9-12 20-15 26Z"/><circle cx="18" cy="16" r="5" fill="#fff"/></svg>${label}</div>`;
      };
      const markerIcon = (naver, current, index, palette = activePalette(), planned = false) => ({
        content: markerHtml(current, index, palette, planned),
        anchor: new naver.maps.Point(18, 42),
      });
      const clusterIcon = (naver, count, palette) => ({
        content: `<div class="danduli-map-cluster" style="--pin-primary:${palette.primary}">${count}</div>`,
        anchor: new naver.maps.Point(19, 19),
      });

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'\"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character] || character));

      const timeText = (value) => {
        if (!value) return '현재';
        try { return new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit' }).format(new Date(value)); }
        catch { return ''; }
      };

      const dayText = (value) => {
        try { return new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }).format(new Date(value)); }
        catch { return ''; }
      };

      // Facility images must be explicitly provided. Load only in an opened
      // info card, never for the whole map and never substitute an unrelated photo.
      const safePhoto = (value) => {
        if (typeof value !== 'string') return '';
        try { const url = new URL(value); return url.protocol === 'https:' ? escapeHtml(url.href) : ''; }
        catch { return ''; }
      };
      const placeCard = (visit, mode) => {
        const name = escapeHtml(visit.placeName || (mode === 'date-plan' ? '데이트 장소' : '위치 기록'));
        const photo = safePhoto(visit.photoUrl);
        const subtitle = mode === 'date-plan'
          ? '함께 가고 싶은 장소'
          : `${escapeHtml(dayText(visit.arrivedAt))} · ${escapeHtml(timeText(visit.arrivedAt))}${visit.leftAt ? ` ~ ${escapeHtml(timeText(visit.leftAt))}` : ' · 현재'}`;
        const address = visit.address ? `<small>${escapeHtml(visit.address)}</small>` : '';
        return `<div class="danduli-place-card">${photo ? `<img src="${photo}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}<strong>${name}</strong><small>${subtitle}</small>${address}</div>`;
      };
      const clustersFor = (visits, mode, zoom) => {
        if (!['footprint-pins', 'date-plan'].includes(mode) || zoom > 14) return visits.map((visit) => [visit]);
        const grid = new Map();
        const step = 0.008 * 2 ** (14 - Math.max(zoom, 3));
        for (const visit of visits) {
          const lat = Number(visit.latitude);
          const lng = Number(visit.longitude);
          const lonStep = step / Math.max(0.25, Math.cos(lat * Math.PI / 180));
          const key = `${Math.floor(lat / step)}:${Math.floor(lng / lonStep)}`;
          if (!grid.has(key)) grid.set(key, []);
          grid.get(key).push(visit);
        }
        return [...grid.values()];
      };

      const clearOverlays = () => {
        overlays.forEach((overlay) => { try { overlay.setMap(null); } catch {} });
        overlays = [];
      };

      const clearFocus = () => {
        try { focusPopup?.close(); } catch {}
        try { focusOverlay?.setMap(null); } catch {}
        focusPopup = null;
        focusOverlay = null;
      };

      const render = ({ visits = [], mode = 'map', keepViewport = false, connectStops = false, numbered = false } = {}, preserveViewport = false) => {
        const modeChanged = lastRender.mode !== mode;
        lastRender = { visits: Array.isArray(visits) ? visits : [], mode, keepViewport, connectStops, numbered };
        if (!map || !hasMapSdk()) return;
        if (modeChanged) restoredForMode = restoreViewport(mode);
        const naver = window.naver;
        const palette = activePalette();
        // Repaint overlays without resizing the map: a resize can emit zoom_changed.
        clearOverlays();
        // Keep the selected date-plan marker and viewport through result/label re-renders.
        // A new search or explicit dismissal sends clear-focus from the parent.

        const validVisits = lastRender.visits
          .filter((visit) => Number.isFinite(Number(visit.latitude)) && Number.isFinite(Number(visit.longitude)))
          .sort((a, b) => new Date(a.arrivedAt || 0).getTime() - new Date(b.arrivedAt || 0).getTime());

        lastMarkersZoom = map.getZoom();
        if (!validVisits.length) {
          // The Seoul city hall coordinates are only an initial map default.
          // Removing a course/marker or zooming an empty map must never recenter it.
          return;
        }

        // Markers and the route reuse the exact same LatLng objects. The path
        // therefore ends at each marker's geographic center rather than a
        // separately calculated pixel offset.
        const points = validVisits.map((visit) => new naver.maps.LatLng(Number(visit.latitude), Number(visit.longitude)));

        // The recent-places screen can contain visits from more than one day.
        // Connect every displayed visit chronologically so the route never
        // disappears simply because two visible points belong to different days.
        if (points.length >= 2 && (connectStops || (mode !== 'footprint-pins' && mode !== 'date-plan'))) {
          overlays.push(new naver.maps.Polyline({
            map,
            path: points,
            strokeColor: palette.accent,
            strokeWeight: 2,
            strokeOpacity: 0.9,
            strokeLineCap: 'round',
            strokeLineJoin: 'round',
            zIndex: 100,
          }));
        }

        (numbered ? validVisits.map((visit) => [visit]) : clustersFor(validVisits, mode, map.getZoom())).forEach((group) => {
          if (group.length > 1) {
            const latitude = group.reduce((sum, visit) => sum + Number(visit.latitude), 0) / group.length;
            const longitude = group.reduce((sum, visit) => sum + Number(visit.longitude), 0) / group.length;
            const marker = new naver.maps.Marker({
              map, position: new naver.maps.LatLng(latitude, longitude),
              icon: clusterIcon(naver, group.length, palette), zIndex: 230,
            });
            naver.maps.Event.addListener(marker, 'click', () => {
              map.setCenter(new naver.maps.LatLng(latitude, longitude));
              map.setZoom(Math.min(17, map.getZoom() + 2));
            });
            overlays.push(marker);
            return;
          }
          const visit = group[0];
          const index = validVisits.indexOf(visit);
          const current = !visit.leftAt && index === validVisits.length - 1;
          const marker = new naver.maps.Marker({
            map, position: points[index],
            icon: markerIcon(naver, current, mode === 'footprints' || numbered ? index : undefined, palette, mode === 'date-plan'),
            zIndex: 200,
          });
          const popup = new naver.maps.InfoWindow({
            content: placeCard(visit, mode), borderWidth: 0, backgroundColor: '#fff',
          });
          naver.maps.Event.addListener(marker, 'click', () => {
            if (mode === 'date-plan' && typeof visit.id === 'string' && /^search-\d+$/.test(visit.id)) {
              focus(visit, true);
              send('search-marker-selected', { id: visit.id });
            } else if (mode === 'date-plan' && typeof visit.id === 'string') {
              focus(visit, true);
              send('saved-marker-selected', { id: visit.id });
            } else {
              map.setCenter(points[index]);
              popup.open(map, marker);
            }
          });
          overlays.push(marker);
        });

        // Reopening an existing plan should not override its remembered position.
        // An explicit new search can still fit its returned branches into view.
        const hasSearchResults = mode === 'date-plan'
          && validVisits.some((visit) => typeof visit.id === 'string' && /^search-\d+$/.test(visit.id));
        if (focusOverlay || keepViewport || preserveViewport || (restoredForMode && !hasSearchResults)) return;
        if (points.length === 1) {
          map.setCenter(points[0]);
          map.setZoom(17);
        } else {
          const bounds = new naver.maps.LatLngBounds();
          points.forEach((point) => bounds.extend(point));
          map.fitBounds(bounds, { top: 34, right: 34, bottom: 34, left: 34 });
        }
      };

      const focus = (visit, showPopup = true) => {
        if (!map || !hasMapSdk() || !visit) return;
        const latitude = Number(visit.latitude);
        const longitude = Number(visit.longitude);
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
        const naver = window.naver;
        const point = new naver.maps.LatLng(latitude, longitude);
        clearFocus();
        focusOverlay = new naver.maps.Marker({
          map,
          position: point,
          icon: markerIcon(naver, true, lastRender.numbered ? lastRender.visits.findIndex((item) => Number(item.latitude) === Number(visit.latitude) && Number(item.longitude) === Number(visit.longitude)) : undefined, activePalette(), lastRender.mode === 'date-plan'),
          zIndex: 2000,
        });
        focusPopup = new naver.maps.InfoWindow({
          content: placeCard(visit, lastRender.mode), borderWidth: 0, backgroundColor: '#fff',
        });
        naver.maps.Event.addListener(focusOverlay, 'click', () => focusPopup?.open(map, focusOverlay));
        map.setCenter(point);
        map.setZoom(17);
        if (showPopup !== false) focusPopup.open(map, focusOverlay);
      };

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const data = event.data || {};
        if (data.source !== 'route-map-parent') return;
        if (data.type === 'render') { parentRenderReceived = true; render(data); }
        if (data.type === 'set-pick-mode') pickMode = data.enabled === true && lastRender.mode === 'date-plan';
        if (data.type === 'fit-visits' && map && hasMapSdk()) {
          const points = lastRender.visits.filter((v) => Number.isFinite(Number(v.latitude)) && Number.isFinite(Number(v.longitude)))
            .map((v) => new naver.maps.LatLng(Number(v.latitude), Number(v.longitude)));
          if (points.length === 1) { map.setCenter(points[0]); map.setZoom(17); }
          else if (points.length > 1) {
            const bounds = new naver.maps.LatLngBounds(); points.forEach((point) => bounds.extend(point));
            map.fitBounds(bounds, { top: 50, right: 40, bottom: 50, left: 40 });
          }
        }
        if (data.type === 'request-viewport' && map) {
          // Reply with the CURRENT map rectangle. A previously pushed idle
          // event can refer to the default Seoul map before viewport restore.
          const sw = map.getBounds().getSW(), ne = map.getBounds().getNE();
          const bounds = { west: sw.lng(), south: sw.lat(), east: ne.lng(), north: ne.lat() };
          send('viewport-changed', { bounds });
          if (typeof data.requestId === 'string' && /^viewport-\d+$/.test(data.requestId)) {
            send('viewport-snapshot', { requestId: data.requestId, bounds });
          }
        }
        if (data.type === 'pan-to' && map && hasMapSdk()) {
          const latitude = Number(data.latitude), longitude = Number(data.longitude);
          const zoom = Number(data.zoom);
          if (Number.isFinite(latitude) && latitude >= -90 && latitude <= 90
            && Number.isFinite(longitude) && longitude >= -180 && longitude <= 180) {
            clearFocus();
            map.setCenter(new window.naver.maps.LatLng(latitude, longitude));
            if (Number.isInteger(zoom) && zoom >= 3 && zoom <= 21) map.setZoom(zoom);
          }
        }
        if (data.type === 'focus') focus(data.visit, data.showPopup);
        if (data.type === 'clear-focus') { clearFocus(); render(lastRender, true); }
        if (data.type === 'resize' && map && hasMapSdk()) window.naver.maps.Event.trigger(map, 'resize');
      });

      try {
        if (window.parent !== window && window.parent.location.origin === location.origin) {
          const themeObserver = new MutationObserver(() => {
            if (initialized) render(lastRender, true);
          });
          themeObserver.observe(window.parent.document.documentElement, {
            attributes: true,
            attributeFilter: ['data-route-theme', 'data-meluni-theme', 'class', 'style'],
          });
        }
      } catch { /* theme sync is optional in standalone mode */ }

      window.navermap_authFailure = () => {
        authFailed = true;
        fail(
          'auth-error',
          '네이버 지도 인증이 거부됐어요',
          'NAVER Cloud Maps의 Dynamic Map과 Web 서비스 URL을 다시 확인해 주세요.',
          `NAVER_AUTH_FAILED · ${location.origin}`,
        );
      };

      const initializeMap = () => {
        if (authFailed || initialized || loadFailed || !hasMapSdk()) return;
        try {
          map = new window.naver.maps.Map(document.getElementById('map'), {
            center: new window.naver.maps.LatLng(37.5666103, 126.9783882),
            zoom: 15,
            zoomControl: true,
            zoomControlOptions: { position: window.naver.maps.Position.TOP_RIGHT },
          });
          // Wait until the zoom animation settles. Rebuilding markers on each
          // zoom_changed event causes repeated tile redraws/white flashes.
          naver.maps.Event.addListener(map, 'idle', () => {
            rememberViewport();
            const sw = map.getBounds().getSW(), ne = map.getBounds().getNE();
            send('viewport-changed', { bounds: { west: sw.lng(), south: sw.lat(), east: ne.lng(), north: ne.lat() } });
            if (lastRender.visits.length
              && ['footprint-pins', 'date-plan'].includes(lastRender.mode)
              && map.getZoom() !== lastMarkersZoom) render(lastRender, true);
          });
          naver.maps.Event.addListener(map, 'click', (event) => {
            if (!pickMode || lastRender.mode !== 'date-plan') return;
            // NAVER's base map exposes tap coordinates, not the printed POI
            // name. The parent matches nearby search results or requests
            // the user to confirm the location/name before saving.
            const lat = Number(event.coord?.lat());
            const lng = Number(event.coord?.lng());
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
            send('map-point-selected', { latitude: lat, longitude: lng });
          });
          initialized = true;
          window.clearTimeout(initTimer);
          clearSdkWait();
          hideStatus();
          requestAnimationFrame(() => requestAnimationFrame(() => window.naver.maps.Event.trigger(map, 'resize')));
          send('ready', { origin: location.origin, authMode: 'ncpKeyId' });
          render(lastRender);
        } catch (error) {
          console.error('[ROUTE map host init]', error);
          fail(
            'init-error',
            '네이버 지도 초기화에 실패했어요',
            '지도 SDK는 준비됐지만 Map 객체 생성 중 오류가 발생했어요.',
            error instanceof Error ? error.message : 'NAVER_MAP_INIT_FAILED',
          );
        }
      };

      const waitForMapSdk = (source) => {
        if (authFailed || initialized || loadFailed) return;
        if (!sdkWaitStartedAt) sdkWaitStartedAt = Date.now();
        if (hasMapSdk()) {
          initializeMap();
          return;
        }
        const elapsed = Date.now() - sdkWaitStartedAt;
        showStatus(
          '네이버 지도 SDK를 준비하고 있어요',
          '응답은 받았고 지도 객체가 준비될 때까지 잠시 기다리고 있어요.',
          `SDK_WAITING · ${source} · ${Math.round(elapsed / 100) / 10}s`,
        );
        if (elapsed >= 7000) {
          fail(
            'script-error',
            '네이버 지도 SDK 준비가 완료되지 않았어요',
            '응답은 받았지만 naver.maps 객체가 생성되지 않았어요. 인증 또는 SDK 응답 내용을 추가로 확인해야 해요.',
            `NAVER_MAP_SDK_MISSING · ${source}`,
          );
          return;
        }
        sdkWaitTimer = window.setTimeout(() => waitForMapSdk(source), 100);
      };

      window.__routeNaverMapReady = () => waitForMapSdk('callback');

      send('host-ready', { origin: location.origin });
      send('sdk-loading', { origin: location.origin, authMode: 'ncpKeyId' });
      showStatus('네이버 지도를 불러오는 중이에요', '지도 SDK와 인증 상태를 확인하고 있어요.', `SDK_LOADING · ${location.origin}`);

      const script = document.createElement('script');
      script.async = true;
      script.defer = true;
      script.src = SDK_URL;
      script.onload = () => {
        window.setTimeout(() => waitForMapSdk('script-onload'), 50);
      };
      script.onerror = () => {
        fail(
          'script-error',
          '네이버 지도 SDK에 연결하지 못했어요',
          '브라우저의 네트워크, 광고 차단·보안 DNS 또는 NAVER 지도 SDK 연결 상태를 확인해 주세요.',
          'NAVER_SDK_LOAD_FAILED',
        );
      };
      document.head.appendChild(script);

      initTimer = window.setTimeout(() => {
        if (initialized || authFailed || loadFailed) return;
        if (hasMapSdk()) {
          initializeMap();
          return;
        }
        waitForMapSdk('timeout-fallback');
      }, 2500);
    })();
  </script>
</body>
</html>
